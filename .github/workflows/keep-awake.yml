name: Keep the archive awake

# Supabase pauses a free project after about a week with no database activity.
# This asks for the public launch schedule once a day so the project stays up
# through 3 December. It reads no archive content.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database for the launch schedule
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY"
          curl --fail-with-body --silent --show-error \
            "$SUPABASE_URL/rest/v1/site_settings?select=launch_at&id=eq.1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY"
          echo
